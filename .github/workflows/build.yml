name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # Keeps one debug signing key, so a new APK installs over the previous one.
      - uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:common:test testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Test counts and Room schema
        run: |
          grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' $(find . -path '*/build/test-results/*' -name '*.xml')
          cat core/database/schemas/*/2.json
      - uses: actions/upload-artifact@v6
        with:
          name: A-Music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: "**/build/reports/"
