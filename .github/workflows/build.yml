name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A fixed location, so the debug signing key can be cached.
  ANDROID_USER_HOME: /home/runner/.android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # Keeps one debug signing key, so a new APK installs over the previous one.
      - uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:common:test testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Test counts and Room schema
        run: |
          grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' $(find . -path '*/build/test-results/*' -name '*.xml')
          cat core/database/schemas/*/3.json
      - uses: actions/upload-artifact@v6
        with:
          name: A-Music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: "**/build/reports/"

  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Playback test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace || (adb logcat -d -t 400 '*:W'; exit 1)
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]

